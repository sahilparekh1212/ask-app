# RAG retrieval-quality thresholds enforced by the `ragEval` gate (ADR-0013; see
# Backend/docs/rag-eval.md). Every value is overridable at run time with a system property of the
# same dotted name — e.g. -Drag.eval.min-mrr=0.70 — so CI can tune the bar without editing this file.

# Calibrated to the measured baseline of the current pipeline (embed voyage-3.5-lite → rerank
# rerank-2.5-lite, top-k=5, 100 questions): hit-rate 1.00, recall@k 1.00, MRR 0.83, nDCG@k 0.88.
# Each bar sits below its baseline with headroom, so normal run-to-run variation passes but a real
# regression (reranking off, a lost doc, a bad chunking/model change) trips it.

# How many top results every metric is computed over (also the number of chunks retrieved).
top-k=5

# Minimum fraction of questions whose top-k contains at least one expected source.
min-hit-rate=0.92

# Minimum mean fraction of a question's expected sources that appear in its top-k.
min-recall-at-k=0.90

# Minimum mean reciprocal rank of the first expected source (rewards ranking it first).
min-mrr=0.74

# Minimum mean nDCG@k (rank-discounted gain over binary relevance) — the metric reranking targets.
min-ndcg-at-k=0.80
